# Set the prefix from C-b to M-z
set -g prefix M-z
# Free the original C-b prefix keybinding
unbind C-b
# Ensure that we can send M-z to other apps
bind M-z send-prefix

# Set the delay between prefix and command
set -s escape-time 1

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -w -g pane-base-index 1

# Focus-events
set -g focus-events on

# Reload the file with Prefix r
bind r\
  source-file ~/.tmux.conf \; \
  display-message "Configuration reloaded"

# Move between panes with Prefix h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle through the windows
bind C-h select-window -t :-
bind C-l select-window -t :+

# Resize panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Enable mouse support
# set -g mouse on

# Set the default terminal mode to 256color mode
set -g default-terminal "tmux-256color"

# Set the status line's colors
set -g status-style fg=white,bg=black

# Set the color of the window list
set -g window-status-style fg=cyan,bg=black

# Set colors for the active window
set -g window-status-current-style fg=white,bold,bg=red

# Pane border style: single, double, heavy, simple, number
set -w -g pane-border-lines single

# Add indicators for two-pane setup
set -g pane-border-indicators arrows

# Add status to panes
set -g pane-border-status top

# Active pane normal, other shaded out
set -g window-style fg=color240,bg=black
set -g window-active-style fg=white,bg=color235

# Command / message line
set -g message-style fg=white,bg=color242,bold



